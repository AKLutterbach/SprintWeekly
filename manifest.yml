app:
  id: ari:cloud:ecosystem::app/c4f2a82d-82a8-48a5-8d53-ed801749f46f
  description: Automate client-ready Jira sprint reports with Smart Sprints.
  # Enable licensing to allow paid tiers in Atlassian Marketplace
  licensing:
    enabled: true
  runtime:
    name: nodejs22.x
    architecture: arm64
    memoryMB: 256

modules:
  function:
    - key: resolver
      handler: resolvers/index.handler
    - key: sprintClosedHandler
      handler: resolvers/index.sprintClosedHandler
  trigger:
    - key: sprint-closed-email-trigger
      function: sprintClosedHandler
      events:
        - avi:jira-software:closed:sprint
  jira:globalPage:
    - key: weekly-digest-global
      resource: sprint-report-ui
      resolver:
        function: resolver
      title: Smart Sprints
      layout: blank
      icon: resource:sprint-report-ui;smart-sprints-icon.png
  jira:projectPage:
    - key: sprint-weekly-custom-page
      resource: sprint-report-ui
      resolver:
        function: resolver
      title: Smart Sprints
      layout: blank
      icon: resource:sprint-report-ui;smart-sprints-icon.png
resources:
  - key: sprint-report-ui
    path: static/sprint-report/build

permissions:
  scopes:
    - read:board-scope.admin:jira-software
    - read:jira-work
    - read:issue:jira
    - read:project:jira
    - read:issue-details:jira
    - read:sprint:jira-software
    - storage:app
  external:
    fetch:
      backend:
        - address: https://api.resend.com
